<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hack Console</title>
  <style>
    body {
      background-color: black;
      color: lime;
      font-family: monospace;
      padding: 20px;
    }
    #consoleOutput {
      white-space: pre-wrap;
      overflow-y: auto;
      height: 400px;
      border: 1px solid lime;
      padding: 10px;
      margin-bottom: 10px;
    }
    #consoleInput {
      width: 100%;
      padding: 10px;
      background-color: black;
      color: lime;
      border: 1px solid lime;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div id="consoleOutput">Welcome to HACK CONSOLE v1.0</div>
  <input type="text" id="consoleInput" placeholder="Type a command..." onkeydown="handleConsoleInput(event)">

  <script>
    const variables = {};

    function generateRandomString(length) {
      const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    async function bruteForcePassword(password, length) {
      const output = document.getElementById("consoleOutput");
      const id = `bruteLine_${Date.now()}`;
      output.innerHTML += `<br><span id="${id}">Brute force: </span>`;
      output.scrollTop = output.scrollHeight;
    
      for (let i = 0; i < length; i++) {
        await new Promise(resolve => setTimeout(resolve, 200));
        const span = document.getElementById(id);
        if (span) {
          span.innerText = `Brute force: ${password.slice(0, i + 1).padEnd(length, "_")}`;
        }
      }
    
      output.innerHTML += `<br>Brute force complete. Password guessed: ${password}`;
      output.scrollTop = output.scrollHeight;
    }

    function resolveArgument(arg) {
      if (/^".*"$/.test(arg)) {
        return arg.slice(1, -1);
      } else if (variables.hasOwnProperty(arg)) {
        return variables[arg];
      } else {
        return `[undefined variable: ${arg}]`;
      }
    }

    async function handleConsoleInput(event) {
      if (event.key === "Enter") {
        const input = document.getElementById("consoleInput");
        const output = document.getElementById("consoleOutput");
        const command = input.value.trim();

        if (command) {
          output.innerHTML += `<br>> ${command}`;
          input.value = "";

          const bruteRegex = /^brute\s+(\S+)\s+(\S+)\s+\[(\d+)\]$/;
          const printRegex = /^print\s+\[(.+?)\]$/;
          const setRegex = /^set\s+(\w+)\s*=\s*(.+)$/;

          const bruteMatch = command.match(bruteRegex);
          const printMatch = command.match(printRegex);
          const setMatch = command.match(setRegex);

          if (setMatch) {
            const varName = setMatch[1];
            let value = setMatch[2].trim();

            if (/^".*"$/.test(value)) {
              value = value.slice(1, -1);
            } else if (!isNaN(value)) {
              value = parseFloat(value);
            }

            variables[varName] = value;
            output.innerHTML += `<br>Set ${varName} = ${value}`;
          }

          else if (bruteMatch) {
            const rawUser = bruteMatch[1];
            const rawSite = bruteMatch[2];
            const passLength = parseInt(bruteMatch[3]);

            const user = resolveArgument(rawUser);
            const site = resolveArgument(rawSite);
            const password = generateRandomString(passLength);

            output.innerHTML += `<br>brute forcing ${site} on acc ${user}`;
            await bruteForcePassword(password, passLength);
          }

          else if (printMatch) {
            const arg = resolveArgument(printMatch[1]);
            output.innerHTML += `<br>${arg}`;
          }

          else {
            output.innerHTML += `<br>Unknown command: ${command}`;
          }

          output.scrollTop = output.scrollHeight;
        }
      }
    }
  </script>
</body>
</html>
