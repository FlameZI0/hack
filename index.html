<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hack Console with Firebase Login</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7XFPp6V73xcqmv64-T2Zabq4vIfYEaVA",
      authDomain: "efwes-89b5a.firebaseapp.com",
      projectId: "efwes-89b5a",
      storageBucket: "efwes-89b5a.appspot.com",
      messagingSenderId: "734782298167",
      appId: "1:734782298167:web:65e3ecfb034a772f05c7b2",
      measurementId: "G-DGJW2LG783"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let userData = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        userData = {
          displayName: user.displayName,
          email: user.email,
          photoURL: user.photoURL
        };
        document.getElementById("login").style.display = "none";
        document.getElementById("consoleWindow").style.display = "block";
      } else {
        document.getElementById("login").style.display = "block";
        document.getElementById("consoleWindow").style.display = "none";
      }
    });

    window.googleLogin = async function () {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("Login failed: " + err.message);
      }
    };
  </script>
  <style>
    body {
      font-family: "Courier New", monospace;
      background-color: #0d0d0d;
      color: #00ff88;
      font-size: 18px;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }
    #login {
      margin-top: 200px;
    }
    #login button {
      background-color: #111;
      color: #00ff88;
      border: 1px solid #00ff88;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #consoleWindow {
      display: none;
      border: 1px solid #333;
      background-color: #121212;
      padding: 20px;
      width: 500px;
      height: 400px;
      box-sizing: border-box;
      box-shadow: inset 0 0 8px #000;
      position: absolute;
      top: 100px;
      left: 100px;
      cursor: default;
      z-index: 1000;
      resize: both;
      overflow: auto;
    }
    #consoleHeader {
      cursor: move;
      font-size: 18px;
      border-bottom: 1px solid #00ff88;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }
    #consoleOutput {
      background-color: #000;
      color: #00ff88;
      height: 250px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #00ff88;
      margin-bottom: 10px;
      text-align: left;
      white-space: pre-wrap;
    }
    #consoleInput {
      width: 100%;
      background-color: #111;
      color: #00ff88;
      border: 1px solid #00ff88;
      padding: 8px;
      font-family: "Courier New", monospace;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="login">
    <h2>Login Required</h2>
    <button onclick="googleLogin()">Sign in with Google</button>
  </div>
  <div id="consoleWindow">
    <div id="consoleHeader">Console</div>
    <div id="consoleOutput">> Welcome to the brute force terminal.</div>
    <input id="consoleInput" placeholder="Type a command..." onkeydown="handleConsoleInput(event)">
  </div>
  <script>
    const variables = {};

    function generateRandomString(length) {
      const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    async function bruteForcePassword(password, length) {
      const output = document.getElementById("consoleOutput");
      const id = `bruteLine_${Date.now()}`;
      output.innerHTML += `<br><span id="${id}">Brute force: </span>`;
      output.scrollTop = output.scrollHeight;
      for (let i = 0; i < length; i++) {
        await new Promise(resolve => setTimeout(resolve, 200));
        const span = document.getElementById(id);
        if (span) {
          span.innerText = `Brute force: ${password.slice(0, i + 1).padEnd(length, "_")}`;
        }
      }
      output.innerHTML += `<br>Brute force complete. Password guessed: ${password}`;
      output.scrollTop = output.scrollHeight;
    }

    function resolveArgument(arg) {
      if (/^".*"$/.test(arg)) {
        return arg.slice(1, -1);
      } else if (variables.hasOwnProperty(arg)) {
        return variables[arg];
      } else {
        return `[undefined variable: ${arg}]`;
      }
    }

    async function handleConsoleInput(event) {
      if (event.key === "Enter") {
        const input = document.getElementById("consoleInput");
        const output = document.getElementById("consoleOutput");
        const command = input.value.trim();
        if (command) {
          output.innerHTML += `\n> ${command}`;
          input.value = "";
          const bruteRegex = /^brute\s+(\S+)\s+(\S+)\s+\[(\d+)\]$/;
          const printRegex = /^print\s+\[(.+?)\]$/;
          const setRegex = /^set\s+(\w+)\s*=\s*(.+)$/;
          const getUserRegex = /^get_user$/;

          const bruteMatch = command.match(bruteRegex);
          const printMatch = command.match(printRegex);
          const setMatch = command.match(setRegex);
          const getUserMatch = command.match(getUserRegex);

          if (setMatch) {
            const varName = setMatch[1];
            let value = setMatch[2].trim();
            if (/^".*"$/.test(value)) {
              value = value.slice(1, -1);
            } else if (!isNaN(value)) {
              value = parseFloat(value);
            }
            variables[varName] = value;
            output.innerHTML += `\nSet ${varName} = ${value}`;
          } else if (bruteMatch) {
            const rawUser = bruteMatch[1];
            const rawSite = bruteMatch[2];
            const passLength = parseInt(bruteMatch[3]);
            const user = resolveArgument(rawUser);
            const site = resolveArgument(rawSite);
            const password = generateRandomString(passLength);
            output.innerHTML += `\nBrute forcing ${site} on acc ${user}`;
            await bruteForcePassword(password, passLength);
          } else if (printMatch) {
            const arg = resolveArgument(printMatch[1]);
            output.innerHTML += `\n${arg}`;
          } else if (getUserMatch) {
            if (userData) {
              output.innerHTML += `\nDisplay Name: ${userData.displayName}`;
              output.innerHTML += `\nEmail: ${userData.email}`;
              output.innerHTML += `\nProfile Picture: ${userData.photoURL}`;
            } else {
              output.innerHTML += `\nUser not logged in.`;
            }
          } else {
            output.innerHTML += `\nUnknown command: ${command}`;
          }
          output.scrollTop = output.scrollHeight;
        }
      }
    }
  </script>
</body>
</html>
